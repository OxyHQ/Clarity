name: Refresh build cache

# Weekly, rebuild the production image(s) with NO cache and write the fresh
# layers into the same GitHub Actions cache scope deploy-aws.yml reads.
#
# The deploy reuses cached layers, so without this an `apt-get`/`apk` layer
# would stay as old as the last time its inputs changed and stop picking up OS
# security patches. This job re-runs every step, then overwrites the scope; the
# next real deploy builds on those fresh layers. Base images are pinned by
# digest, so this does NOT refresh them: a patched base arrives only through a
# digest bump, which the reviewed-image pin makes the owner re-review.
#
# It builds only: no AWS credentials, no ECR push, no deploy. It runs on the
# default branch (schedule) or a dispatch from main, so it writes main's cache,
# which only main-branch deploys read; no pull_request workflow writes a scope.
# Dockerfile, context and target come from the same reviewed-image guard as
# deploy-aws.yml (platform matched by hand), so the layers it writes are the
# ones the deploy looks up, and it refuses to warm the cache from inputs the
# owner has not reviewed.

on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-build-cache
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Refuse unreviewed API image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe clarity-api

      # push: false and no load: the result lives only in the exported cache.
      - name: Rebuild the clarity backend image from scratch into the cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.reviewed.outputs.context }}
          file: ${{ steps.reviewed.outputs.dockerfile }}
          target: ${{ steps.reviewed.outputs.target }}
          platforms: linux/arm64
          push: false
          no-cache: true
          pull: true
          cache-to: type=gha,mode=max,scope=clarity-backend

      - name: Refuse unreviewed SearXNG image build inputs
        id: reviewed-searxng
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe clarity-searxng

      # push: false and no load: the result lives only in the exported cache.
      - name: Rebuild the SearXNG image from scratch into the cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.reviewed-searxng.outputs.context }}
          file: ${{ steps.reviewed-searxng.outputs.dockerfile }}
          target: ${{ steps.reviewed-searxng.outputs.target }}
          platforms: linux/arm64
          push: false
          no-cache: true
          pull: true
          cache-to: type=gha,mode=max,scope=clarity-searxng
