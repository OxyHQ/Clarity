name: Deploy

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed current main SHA
        required: true
        type: string
      ci_run_id:
        description: Successful push CI run for this exact main SHA
        required: true
        type: string
  # After CI passes on a push to main, never alongside it. Until 2026-10 this ran
  # on every push with no path filter, in parallel with CI, so a commit whose CI
  # went red still reached clarity.surf and every backend-only merge rebuilt and
  # re-uploaded the web app. The `scope` job below owns the guards and the path
  # scope `push` cannot give a `workflow_run`.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  # The commit under release: the one CI tested on `workflow_run`, the
  # dispatched (reviewed) main SHA on a manual release. Not `github.sha` alone,
  # which on `workflow_run` is whatever main's head was when CI finished.
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Decides, OUTSIDE the release lane, whether `deploy-frontend` runs at all:
  # the trigger guards, which commit to release (`gate`), and whether anything
  # the web app is built from changed since the last commit this workflow
  # released (`target`). See .github/scripts/deploy-scope.sh.
  scope:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      frontend: ${{ steps.frontend.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SHA }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Release only the newest CI-green main commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/deploy-scope.sh gate
      # What the web build reads: the frontend, the two workspaces it builds
      # first (shared-types, sdk), the root manifests and config, and this
      # workflow. test-deploy-scope.sh reads this line.
      - name: Decide whether anything the web app ships changed
        id: frontend
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FRONTEND_PATHS: '^(packages/(frontend|shared-types|sdk)/|package\.json$|bun\.lock$|bunfig\.toml$|app\.json$|tsconfig[^/]*\.json$|\.github/workflows/deploy\.yml$)'
        run: bash .github/scripts/deploy-scope.sh target frontend include "$FRONTEND_PATHS" clarity-release-frontend-

  deploy-frontend:
    needs: scope
    permissions:
      contents: read
      actions: read
    if: >-
      github.ref == 'refs/heads/main' && vars.OXY_1519_ROLLOUT_HOLD != 'true' &&
      needs.scope.outputs.frontend == 'true'
    name: Deploy the web app to Cloudflare
    runs-on: ubuntu-latest
    # One Worker upload at a time, never cancelled mid-upload. On the job, so
    # only a run `scope` judged releasable enters the lane.
    concurrency:
      group: deploy-clarity-frontend
      cancel-in-progress: false
    # Install, web export and upload; without a bound a hang holds one of the
    # org's 20 shared job slots for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Verify manual release source and CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_CI_WORKFLOW: .github/workflows/ci.yml
          OXY_1519_ROLLOUT_HOLD: ${{ vars.OXY_1519_ROLLOUT_HOLD }}
        run: python3 .github/scripts/verify-manual-frontend.py

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web
        run: bun run build:frontend

      # A WORKER, not a Pages project. A Pages project always serves
      # `<project>.pages.dev` with no way to turn it off, which put a second,
      # CORS-less copy of Clarity on the internet — `PRODUCTION_ORIGINS` in
      # packages/backend/src/index.ts admits `https://clarity.surf` and nothing
      # else. `workers_dev = false` in packages/frontend/wrangler.toml leaves
      # `clarity.surf` as the only way in.
      #
      # The Pages production-branch PATCH that used to sit here is gone with the
      # project: Pages stored the production branch on the project and published
      # anything else as a preview, which a Worker has no equivalent of.
      # Everything the deploy needs — the assets directory, the SPA fallback,
      # the custom domain — is declared in wrangler.toml rather than passed
      # here, so a deploy cannot disagree with the config.
      #
      # DEPLOYED WITH `bunx wrangler@4`, NOT `cloudflare/wrangler-action@v3`.
      # Do not "modernise" this back to the action. The action installs its own
      # wrangler into the working tree mid-deploy, and that install is the only
      # thing that has ever failed this step — once in 78 runs, which is rare
      # and total rather than recurring. Run 34063685022 (2026-09-06):
      #
      #   [command] /home/runner/.bun/bin/bun i wrangler@3.90.0
      #   error: Fail extracting tarball for "wrangler"
      #   ##[error] 🚨 Action failed
      #
      # Homiio took a production outage from the identical error on 2026-08-09
      # — run 31292337344 published nothing and left a stale bundle running
      # against a changed API — and moved off the action in #291; Mercaria's
      # AGENTS.md forbids it outright. The action also picks its package manager
      # by looking for a lockfile beside its `workingDirectory`, and in this
      # monorepo the lockfile is at the ROOT: aiming it at `packages/frontend`
      # would make it fall back to npm, which cannot resolve `workspace:*` at
      # all. Alia's canvas deploy hit exactly that.
      #
      # PINNED TO A MAJOR on purpose. Unpinned, `bunx wrangler` re-resolves the
      # latest major on every deploy, changing the deploy path with no diff to
      # show for it. wrangler.toml was validated against 4.130.0.
      #
      # wrangler reads its credentials from the environment, which is why these
      # are `env:` rather than arguments.
      - name: Verify manual release source and CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_CI_RUN_ID: ${{ inputs.ci_run_id }}
          EXPECTED_CI_WORKFLOW: .github/workflows/ci.yml
          OXY_1519_ROLLOUT_HOLD: ${{ vars.OXY_1519_ROLLOUT_HOLD }}
        run: python3 .github/scripts/verify-manual-frontend.py

      - name: Deploy the Worker
        run: cd packages/frontend && bunx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The scope job's base for the next release: the last commit this workflow
      # actually deployed, as an Actions cache key (its content is irrelevant).
      # Only a successful upload reaches this step, and it runs on main only, so
      # no pull request can move it. Lost or evicted, the next run releases.
      - name: Write the release marker
        run: printf '%s\n' "$RELEASE_SHA" >"$RUNNER_TEMP/release-marker"
      - name: Record this release for the next scope decision
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/release-marker
          key: clarity-release-frontend-${{ env.RELEASE_SHA }}
