name: CI

# Pull requests into ANY base, so a PR stacked on another branch is checked
# like one into main (the image build and boot tests included).
# workflow_dispatch: bump-base-digests.yml dispatches this workflow on its bump
# branch, because a pull request opened with GITHUB_TOKEN triggers no
# `pull_request` run. A dispatched run skips `changes` and so runs every job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests cancel a superseded run; main never does. deploy-aws.yml is
# `workflow_run` on this workflow and deploys only on `conclusion == 'success'`,
# so a main run cancelled by the next merge would silently skip that commit's
# deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests only: decides whether the frontend export is affected. Push to
  # main (and anything else) skips this job and runs everything.
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      searxng: ${{ steps.filter.outputs.searxng }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'packages/frontend/**'
              - 'packages/shared-types/**'
              - 'packages/sdk/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'app.json'
              - 'tsconfig*.json'
              - '.github/**'
            backend:
              - 'packages/backend/**'
              - 'packages/shared-types/**'
              - 'packages/sdk/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '.dockerignore'
              - '.github/**'
            searxng:
              - 'packages/searxng/**'
              - '.github/**'

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clarity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clarity_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clarity_ci

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The production image's build inputs (Dockerfile, context, target and
      # both .dockerignore files) must match the one reviewed pin in
      # .github/scripts/reviewed-images.json. The deploy refuses to build on a
      # mismatch, so catching it here is what stops a merge from stranding
      # main undeployable. The fixture tests run first so a green check means
      # the gate can fail, not that it stopped looking.
      - name: Prove the reviewed-image gate can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_reviewed_image.py
      - name: Prove the base-image digest bump
        run: python3 -B -m unittest discover -s .github/scripts -p test_bump_base_digests.py
      - name: Verify the production image's build inputs are reviewed
        run: python3 -B .github/scripts/reviewed-image.py check

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check (Biome)
        run: bunx biome ci .

      # The API is bundled with esbuild, which strips types without checking
      # them, so a type error reached main unnoticed until this step existed.
      # The backend resolves @clarity/shared-types from its built dist.
      - name: Typecheck API and SDK
        run: |
          bun run build:shared-types
          bun run --filter @clarity/backend typecheck
          bun run --filter @clarity.surf/sdk typecheck

      - name: Validate and apply PostgreSQL migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          bun run --filter @clarity/backend db:migrate -- --target-database=clarity_ci --phase=all --dry-run
          bun run --filter @clarity/backend db:migrate -- --target-database=clarity_ci --phase=all
          bun run --filter @clarity/backend db:migrate -- --target-database=clarity_ci --phase=pre
          bun run --filter @clarity/backend db:migrate -- --target-database=clarity_ci --phase=post --dry-run
          bun run --filter @clarity/backend db:migrate -- --target-database=clarity_ci --phase=post
          bun run --filter @clarity/backend db:migrate -- --target-database=clarity_ci --phase=post

      - name: Run API tests
        run: bun run --filter @clarity/backend test

      # Production runs the backend on Bun (packages/backend/Dockerfile), so the
      # unit suite also runs under Bun's runtime and test runner, not only under
      # vitest on Node. `--isolate` gives each file its own module registry, as
      # vitest does. The *.postgres / *-integration suites stay on vitest
      # (vi.hoisted, importOriginal, shared-database serialisation); the image
      # smoke covers PostgreSQL under Bun.
      - name: Run API tests under Bun
        run: bun run --filter @clarity/backend test:bun

      - name: Run frontend tests
        run: bun run --filter @clarity/frontend test

      # A step here rather than its own job: the build is seconds of work and a
      # separate job paid a full runner setup and install for it.
      - name: Build API
        run: bun run build:backend

      # EXECUTES the built artefacts under bun, the image's runtime and command,
      # with boot forced to fail, asserting a non-zero exit, plus a real boot
      # and SIGTERM shutdown as the control. An uncaught exception at boot whose
      # exit is deferred to an unref'd timer can exit 0 on either runtime.
      - name: The built backend exits non-zero when boot fails
        run: bun run check:backend-entrypoints

  # The production image as ECS runs it, on the architecture it ships for.
  build-backend-image:
    name: Build backend image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true')
    # A throwaway database for the image smoke; nothing else uses it.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clarity
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clarity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # The same Dockerfile and context the deploy builds, from the same gate:
      # what this job boots is what production would build from this commit.
      - name: Refuse unreviewed API image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe clarity-api

      # Reads the deploy's layer cache; never writes it, never pushes.
      - name: Build ARM64 backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.reviewed.outputs.context }}
          file: ${{ steps.reviewed.outputs.dockerfile }}
          target: ${{ steps.reviewed.outputs.target }}
          platforms: linux/arm64
          load: true
          push: false
          tags: clarity-backend:ci
          labels: |-
            io.oxy.source.tree=${{ steps.reviewed.outputs.source_tree }}
            io.oxy.build-inputs.sha256=${{ steps.reviewed.outputs.build_inputs_sha256 }}
          cache-from: type=gha,scope=clarity-backend

      - name: Smoke the backend image under its Bun runtime
        env:
          IMAGE: clarity-backend:ci
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/clarity
        run: bash .github/scripts/smoke-backend-image.sh

  # The SearXNG sidecar as it runs in clarity-api's task: non-root, on fresh
  # volumes and on root-owned ones (what a runtime that mounts its own empty
  # directory at an image VOLUME presents).
  build-searxng-image:
    name: Build SearXNG image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.searxng == 'true')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Refuse unreviewed SearXNG image build inputs
        id: reviewed-searxng
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe clarity-searxng

      # Reads the deploy's layer cache; never writes it, never pushes.
      - name: Build ARM64 SearXNG image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ steps.reviewed-searxng.outputs.context }}
          file: ${{ steps.reviewed-searxng.outputs.dockerfile }}
          target: ${{ steps.reviewed-searxng.outputs.target }}
          platforms: linux/arm64
          load: true
          push: false
          tags: clarity-searxng:ci
          labels: |-
            io.oxy.source.tree=${{ steps.reviewed-searxng.outputs.source_tree }}
            io.oxy.build-inputs.sha256=${{ steps.reviewed-searxng.outputs.build_inputs_sha256 }}
          cache-from: type=gha,scope=clarity-searxng

      - name: Smoke the SearXNG image as a non-root sidecar
        env:
          IMAGE: clarity-searxng:ci
        run: bash .github/scripts/smoke-searxng-image.sh

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Independent of lint-and-test, so it runs in parallel. On pull requests it
    # runs only when the frontend or a shared input changed.
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true')

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `expo export` transpiles with Babel and never type-checks.
      - name: Typecheck frontend
        run: |
          bun run build:shared-types
          bun run build:sdk
          bun run --filter @clarity/frontend typecheck

      - name: Build frontend
        run: bun run build:frontend
