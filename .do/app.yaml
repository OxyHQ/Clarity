# DigitalOcean App Platform API spec for clarity-production
# NOTE: Infrastructure is now managed by SST (sst.config.ts).
# This file is kept as a reference / fallback.
name: clarity-production
region: ams

services:
  - name: clarity-api
    github:
      repo: OxyHQ/Clarity
      branch: master
      deploy_on_push: true

    build_command: >-
      ELECTRON_SKIP_BINARY_DOWNLOAD=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
      bun run build:backend
    run_command: bun run start:backend
    source_dir: /
    environment_slug: node-js
    instance_size_slug: apps-s-2vcpu-4gb
    instance_count: 2

    health_check:
      http_path: /health/ready
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

    http_port: 8080

    envs:
      - key: DATABASE_URL
        type: SECRET
      - key: REDIS_URL
        value: "${db-valkey.DATABASE_URL}"
      - key: REDIS_CA_CERT
        value: "${db-valkey.CA_CERT}"
      - key: ALIA_API_URL
        value: "https://api.alia.onl"
      - key: CLARITY_ALIA_AGENT_ID
        value: "01a0646a-078f-7642-95ef-439952f4f3f9"
      - key: OXY_SERVICE_API_KEY
        value: "oxy_dk_8c84c74a2656b8f5147d4d0b65fcd0e88c192ce64f465f78"
      - key: OXY_SERVICE_API_SECRET
        type: SECRET
      - key: WEB_URL
        value: "https://clarity.surf"
      # Stripe
      - key: STRIPE_SECRET_KEY
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        type: SECRET
      # Browser push
      - key: VAPID_PUBLIC_KEY
        type: SECRET
      - key: VAPID_PRIVATE_KEY
        type: SECRET
      - key: VAPID_SUBJECT
        value: "mailto:contact@clarity.surf"

databases:
  - name: db-valkey
    engine: REDIS
    version: "7"
    production: true
    cluster_name: db-valkey-ams3-04785

domains:
  - domain: api.clarity.surf
    type: PRIMARY
    zone: clarity.surf

alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
  - rule: DEPLOYMENT_LIVE
