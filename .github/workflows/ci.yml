name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pull requests cancel a superseded run; main never does. deploy-aws.yml is
# `workflow_run` on this workflow and deploys only on `conclusion == 'success'`,
# so a main run cancelled by the next merge would silently skip that commit's
# deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests only: decides whether the frontend export is affected. Push to
  # main (and anything else) skips this job and runs everything.
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'packages/frontend/**'
              - 'packages/shared-types/**'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'app.json'
              - 'tsconfig*.json'
              - '.github/**'

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clarity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clarity_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clarity_ci

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check (Biome)
        run: bunx biome ci .

      - name: Validate and apply PostgreSQL migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          bun run --filter @clarity/backend db:migrate -- --target-database=clarity_ci --phase=all --dry-run
          bun run --filter @clarity/backend db:migrate -- --target-database=clarity_ci --phase=all
          bun run --filter @clarity/backend db:migrate -- --target-database=clarity_ci --phase=pre
          bun run --filter @clarity/backend db:migrate -- --target-database=clarity_ci --phase=post --dry-run
          bun run --filter @clarity/backend db:migrate -- --target-database=clarity_ci --phase=post
          bun run --filter @clarity/backend db:migrate -- --target-database=clarity_ci --phase=post

      - name: Run API tests
        run: bun run --filter @clarity/backend test

      - name: Run frontend tests
        run: bun run --filter @clarity/frontend test

      # A step here rather than its own job: the build is seconds of work and a
      # separate job paid a full runner setup and install for it.
      - name: Build API
        run: bun run build:backend

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Independent of lint-and-test, so it runs in parallel. On pull requests it
    # runs only when the frontend or a shared input changed.
    needs: changes
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true')

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build:frontend
