name: Deploy Clarity Backend to AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-clarity-backend
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  ECR_REPOSITORY: oxy/clarity
  SEARXNG_ECR_REPOSITORY: oxy/clarity-searxng
  CLUSTER: oxy-cluster
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-clarity-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Runtime secrets are NOT in GitHub. SSM Parameter Store (/oxy/clarity/*,
      # SecureString) is their single source of truth: the task definitions read
      # them at task start, and nothing in this workflow writes one. Setting or
      # rotating a value is `aws ssm put-parameter --overwrite` by its owner
      # (oxy-infra docs/runbooks/46-app-secrets-in-ssm.md), never a repo secret.
      # Until 2026-10-10 a step here copied GitHub repo secrets into SSM on every
      # deploy. architecture-gates.test.ts fails if a workflow writes SSM or
      # reads an app secret from GitHub again.
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=clarity-backend
          cache-to: type=gha,mode=max,scope=clarity-backend
          provenance: true
          sbom: true

      # The web-discovery sidecar in clarity-api's task (packages/searxng).
      - name: Build and push SearXNG image
        id: searxng
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: packages/searxng
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.SEARXNG_ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha,scope=clarity-searxng
          cache-to: type=gha,mode=max,scope=clarity-searxng
          provenance: true
          sbom: true

      - name: Verify current main before production changes
        run: bash .github/scripts/require-current-main.sh

      # API and crawler worker together: pre-migration, then BOTH rollouts at
      # once, then post-migration (COMPANION_SERVICE in deploy-ecs-service.sh).
      # Measured on run 36464995735: "Deploy API" 604s, then "Deploy crawler
      # worker" 299s after it, serially — and the old worker kept running
      # across the post-migration in between.
      - name: Deploy API and crawler worker
        env:
          SERVICE: clarity-api
          CONTAINER_NAME: clarity-api
          COMPANION_SERVICE: clarity-worker
          COMPANION_CONTAINER_NAME: clarity-worker
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
          SIDECAR_IMAGES_JSON: '{"searxng":"${{ env.ECR_REGISTRY }}/${{ env.SEARXNG_ECR_REPOSITORY }}@${{ steps.searxng.outputs.digest }}"}'
          PRE_DEPLOY_TASK_COMMAND_JSON: '["node","packages/backend/dist/db/migrate.js","--target-database=clarity","--phase=pre"]'
          POST_DEPLOY_TASK_COMMAND_JSON: '["node","packages/backend/dist/db/migrate.js","--target-database=clarity","--phase=post"]'
        run: bash .github/scripts/deploy-ecs-service.sh

      - name: Smoke API
        env:
          CLARITY_API_URL: https://api.clarity.surf
        run: bash .github/scripts/smoke-clarity.sh
